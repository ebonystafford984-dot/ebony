<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Three-page portfolio wireframe</title>
<desc id="desc">Layout sketches for Home, Projects and About or Contact pages, with notes about the planned colors and fonts.</desc>
<rect width="1400" height="900" fill="#f7f2e9"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#29231f">PERSONAL PORTFOLIO — SITE PLAN</text>
<text x="60" y="100" font-family="Arial,sans-serif" font-size="18" fill="#66584f">Three pages share the same navigation and page structure.</text>
<g font-family="Arial,sans-serif" fill="#29231f" stroke="#8a5036" stroke-width="3">
<g transform="translate(55 145)"><text x="0" y="0" stroke="none" font-size="24" font-weight="bold">1. HOME</text><rect x="0" y="20" width="400" height="500" rx="12" fill="#fffdf9"/><rect x="18" y="40" width="364" height="70" rx="7" fill="#ead9c7"/><text x="30" y="70" stroke="none" font-size="17">HEADER + h1: My Portfolio</text><text x="30" y="95" stroke="none" font-size="14">welcome sentence</text><rect x="18" y="122" width="364" height="40" rx="6" fill="#f3e9dd"/><text x="30" y="148" stroke="none" font-size="14">NAV: Home | Projects | About</text><rect x="18" y="176" width="364" height="130" rx="7" fill="white"/><text x="30" y="208" stroke="none" font-size="16" font-weight="bold">SECTION: Welcome</text><text x="30" y="237" stroke="none" font-size="14">intro and goal (h2, h3)</text><text x="30" y="263" stroke="none" font-size="14">placeholder paragraph</text><rect x="18" y="320" width="364" height="135" rx="7" fill="white"/><text x="30" y="352" stroke="none" font-size="16" font-weight="bold">SECTION: Featured Work</text><text x="30" y="381" stroke="none" font-size="14">project preview + link</text><text x="30" y="407" stroke="none" font-size="14">to Projects page</text><rect x="18" y="470" width="364" height="34" rx="6" fill="#ead9c7"/><text x="30" y="493" stroke="none" font-size="14">FOOTER: name + year</text></g>
<g transform="translate(500 145)"><text x="0" y="0" stroke="none" font-size="24" font-weight="bold">2. PROJECTS / WORK</text><rect x="0" y="20" width="400" height="500" rx="12" fill="#fffdf9"/><rect x="18" y="40" width="364" height="70" rx="7" fill="#ead9c7"/><text x="30" y="70" stroke="none" font-size="17">HEADER + h1: Projects / Work</text><text x="30" y="95" stroke="none" font-size="14">short introduction</text><rect x="18" y="122" width="364" height="40" rx="6" fill="#f3e9dd"/><text x="30" y="148" stroke="none" font-size="14">NAV: Home | Projects | About</text><rect x="18" y="176" width="364" height="220" rx="7" fill="white"/><text x="30" y="208" stroke="none" font-size="16" font-weight="bold">SECTION: Featured Projects</text><text x="30" y="237" stroke="none" font-size="14">project article + description</text><text x="30" y="263" stroke="none" font-size="14">Steak 48 sample project</text><text x="30" y="320" stroke="none" font-size="14">another project placeholder</text><rect x="18" y="410" width="364" height="45" rx="7" fill="white"/><text x="30" y="439" stroke="none" font-size="16" font-weight="bold">SECTION: Skills list</text><rect x="18" y="470" width="364" height="34" rx="6" fill="#ead9c7"/><text x="30" y="493" stroke="none" font-size="14">FOOTER: name + year</text></g>
<g transform="translate(945 145)"><text x="0" y="0" stroke="none" font-size="24" font-weight="bold">3. ABOUT / CONTACT</text><rect x="0" y="20" width="400" height="500" rx="12" fill="#fffdf9"/><rect x="18" y="40" width="364" height="70" rx="7" fill="#ead9c7"/><text x="30" y="70" stroke="none" font-size="17">HEADER + h1: About / Contact</text><text x="30" y="95" stroke="none" font-size="14">short introduction</text><rect x="18" y="122" width="364" height="40" rx="6" fill="#f3e9dd"/><text x="30" y="148" stroke="none" font-size="14">NAV: Home | Projects | About</text><rect x="18" y="176" width="364" height="170" rx="7" fill="white"/><text x="30" y="208" stroke="none" font-size="16" font-weight="bold">SECTION: About Me</text><text x="30" y="237" stroke="none" font-size="14">bio placeholder + interests list</text><rect x="18" y="360" width="364" height="95" rx="7" fill="white"/><text x="30" y="392" stroke="none" font-size="16" font-weight="bold">SECTION: Contact</text><text x="30" y="421" stroke="none" font-size="14">contact placeholder</text><rect x="18" y="470" width="364" height="34" rx="6" fill="#ead9c7"/><text x="30" y="493" stroke="none" font-size="14">FOOTER: name + year</text></g>
</g>
<rect x="55" y="720" width="1290" height="125" rx="14" fill="#fffdf9" stroke="#d5c6b8" stroke-width="2"/><text x="82" y="762" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#29231f">DESIGN NOTES</text><text x="82" y="800" font-family="Arial,sans-serif" font-size="17" fill="#29231f">Palette: warm cream #F7F2E9, dark brown #29231F, muted rust #8A5036, soft tan #EAD9C7</text><text x="82" y="829" font-family="Arial,sans-serif" font-size="17" fill="#29231f">Fonts: Georgia for headings and body text; Arial for navigation and labels</text>
</svg>
